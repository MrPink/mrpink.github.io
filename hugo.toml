baseURL = "https://mrpink-vulncheck.github.io/"
locale = "en-us"
title = "mrpink"
enableRobotsTXT = true
enableGitInfo = false

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Notes on security, DevOps and SRE."
  author = "Will Pink"
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = "mrpink"
    Content = "Notes from the trenches of security, DevOps and SRE: infrastructure, incidents, vulnerabilities and the tooling in between."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mrpink-vulncheck"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.fuseOpts]
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 30
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
