{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs";
  const isDark = () => document.body.classList.contains("dark");
  const blocks = [...document.querySelectorAll("pre.mermaid")];
  blocks.forEach((el) => el.dataset.src = el.textContent);
  const render = async () => {
    blocks.forEach((el) => { el.removeAttribute("data-processed"); el.textContent = el.dataset.src; });
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "default" });
    await mermaid.run({ nodes: blocks });
  };
  render();
  document.getElementById("theme-toggle")?.addEventListener("click", () => setTimeout(render, 0));
</script>
{{- end }}
