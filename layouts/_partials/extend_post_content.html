{{- if .Store.Get "hasMermaid" }}
{{- $mermaid := resources.Get "js/mermaid-12.2.0.min.js" | fingerprint "sha384" }}
<script src="{{ $mermaid.RelPermalink }}" integrity="{{ $mermaid.Data.Integrity }}"></script>
<script>
  (() => {
    const isDark = () => document.documentElement.dataset.theme === "dark";
    const blocks = [...document.querySelectorAll("pre.mermaid")];
    blocks.forEach((el) => el.dataset.src = el.textContent);
    const render = async () => {
      blocks.forEach((el) => { el.removeAttribute("data-processed"); el.textContent = el.dataset.src; });
      mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "default" });
      await mermaid.run({ nodes: blocks });
    };
    render();
    new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>
{{- end }}
